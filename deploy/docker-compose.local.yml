name: assistant-agents
services:
  postgres:
    networks: [default]
  agent-server:
    environment:
      DATABASE_URL: postgresql://assistant:${POSTGRES_PASSWORD:?Initialize the local environment first}@postgres:5432/assistant
      ASSISTANT_LOCAL_DEMO: "true"
      MCP_DELEGATION_SECRET: ${MCP_DELEGATION_SECRET:?Initialize the local environment first}
      MCP_HTTP_CONFIG_FILE: /opt/assistant/local-mcp-approval.json
      IDENTITY_HTTP_CONFIG_FILE: /opt/assistant/identity-http.json
      PLATFORM_EXTENSIONS: ${PLATFORM_EXTENSIONS:?Initialize the approved platform extensions first}
    volumes:
      - ./out/local-mcp-approval.json:/opt/assistant/local-mcp-approval.json:ro
      - ./identity-http.local.json:/opt/assistant/identity-http.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [default, integration]
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:3411:3000"
  assistant-web:
    networks: [default]
  assistant-embed:
    environment:
      FRAME_ANCESTORS: http://127.0.0.1:19001
      ASSISTANT_HOST_ORIGIN: http://127.0.0.1:19001
    ports: !override
      - "127.0.0.1:5511:8080"
    networks: [default]
networks:
  integration:
    external: true
    name: assistant-integration
