name: assistant-${DEPLOYMENT_ID:-local}

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy/initialize-local.ps1 first}
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/init-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres-data:
