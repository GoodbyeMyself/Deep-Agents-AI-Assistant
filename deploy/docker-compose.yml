name: assistant-${DEPLOYMENT_ID:-local}

services:
  agent-server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      args:
        PLUGIN_ID: ${PLUGIN_ID:-demo-product-a}
    image: assistant-agent-server:${PLUGIN_ID:-demo-product-a}
    environment:
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-local}
      PLUGIN_ID: ${PLUGIN_ID:-demo-product-a}
      MODEL_NAME: ${MODEL_NAME:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    init: true
    restart: unless-stopped

  assistant-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: assistant-web:${IMAGE_TAG:-local}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      agent-server:
        condition: service_healthy
    init: true
    restart: unless-stopped

  assistant-embed:
    build:
      context: .
      dockerfile: docker/embed.Dockerfile
    image: assistant-embed:${IMAGE_TAG:-local}
    environment:
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-http://127.0.0.1:8080}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${EMBED_PORT:-8081}:8080"
    depends_on:
      agent-server:
        condition: service_healthy
    init: true
    restart: unless-stopped
